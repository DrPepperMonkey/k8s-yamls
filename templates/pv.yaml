apiVersion: v1
kind: PersistentVolume
metadata:
  name: my-pv-resource   # Replace with a unique name
  labels:
    app: my-app          # Example label
  description: "A persistent volume resource for our application."

spec:
  volumeName: my-pv   # The name of the persistent volume
  storageClass: Standard #  The StorageClass to use. (Important!)
  volumeType: Persistent # The type of the storage
  capacity:
    size: 50Gi       # Define the size of the volume
    min: 1Gi         # Minimum size
    max: 100Gi       # Maximum size
  accessModes:
    - ReadWrite
  persistentVolumeClaim:
    name: my-pvc-example  # The name of the PVC
    storageClass: Standard  # The storageClass to use for the PVC
    size: 50Gi  # Define the size of the PVC
    accessModes:
      - ReadWrite
   options:
    #  (Optional - Add configurations here)
    logging:  "info"  # Logging verbosity
    tags:
      # (Optional - Add tags here)
      application: my-app

