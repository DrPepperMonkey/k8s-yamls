apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard-ingress
  namespace: adguard
  annotations:
    adguard.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: adguard.dpmcentral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: adguard-svc
            port:
              number: 80
  - host: adgurad.dpmcentral.com
    http:
      paths:
      - path: /setup
        pathType: Suffix
        backend:
          service:
            name: adguard-svc
            port:
              number: 3000
