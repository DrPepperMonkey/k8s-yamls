apiVersion: v1
kind: Service
metadata:
  name:  adguard-svc
  namespace: adguard
spec:
  selector:
    app:  adguard
  type:  ClusterIP
  ports:
  - name:  dns-tcp
    port:  53
    targetPort: 53
  - name:  dns-udp
    protocol: UDP
    port:  53
    targetPort: 53
  - name:  dhcp-tcp
    port:  67
    targetPort: 67
  - name:  dns-udp
    protocol: UDP
    port:  67
    targetPort: 67
  - name:  http
    port:  80
    targetPort: 80
  - name:  https-tcp
    port:  443
    targetPort: 443
  - name:  https-udp
    protocol: UDP
    port:  443
    targetPort: 443
  - name:  setup
    port:  3000
    targetPort: 3000
