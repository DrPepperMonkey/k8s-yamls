 apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex-ingress
  namespace: plex
  annotations:
    plex.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: plex.dpmcentral.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: plex-svc
            port:
              number: 32400
