apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-deployment
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - name: searxng
        image: searxng
        ports:
        - containerPort: 80
        
---

apiVersion: v1
kind: Service
metadata:
  name: searxng-service
spec:
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - port: 80
      targetPort: 80
