apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - name: searxng
        image: searxng
        ports:
        - containerPort: 8080
        
---

apiVersion: v1
kind: Service
metadata:
  name: searxng-service
  namespace: searxng
spec:
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - port: 8080
      targetPort: 8080
